// Opt-in native next-map votes. Requires --allow-map-voting private preparation.
// Execute before the first map. Keep sv_mapRotation in the canonical mode CFG.
set g_oldVoting "1"
set g_allowVote "1"
set g_voteAllowMap "1"
set g_voteAllowMaprotate "0"
set g_voteAllowRestart "0"
set g_voteAllowGametype "0"
set g_voteAllowKick "0"
set g_voteTime "30"
set g_voteMaxVotes "2"
set g_voteAbstainWeight "1"
set g_voteCooldown "120"

name: build

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
      
    - name: Set up needed libs
      run: | 
        sudo apt-get update
        sudo apt-get install -y g++-multilib gcc-multilib 
        sudo dpkg --add-architecture i386 
        sudo apt-get update
        sudo apt-get install -y nasm
        
    - name: Build server
      run: make
      
    - name: Engine tests
      run: |
        python3 -m unittest discover -s tests -p 'test_*.py'
        gcc -Wall -Wextra -Werror tests/test_bot_policy.c -o /tmp/bot-policy
        /tmp/bot-policy
        python3 tests/run_map_rotation.py
        python3 tests/run_map_voting.py

  windows:
    name: Windows
    runs-on: windows-latest
    
    steps:
    - name: Get MinGW (i686-8.1.0-release-posix-dwarf)
      run: |
        cd C:/
        Start-BitsTransfer -Source https://downloads.sourceforge.net/mingw-w64/i686-8.1.0-release-posix-dwarf-rt_v6-rev0.7z -Destination mingw32.7z
        7z x -y mingw32.7z
        
    - name: Get NASM
      uses: ilammy/setup-nasm@v1  
      
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
      
    - name: Get pexports
      run: |
        Invoke-WebRequest "https://github.com/callofduty4x/CoD4x_Server/raw/master/tools/pexports-0.47-mingw32-bin.tar.xz" -OutFile "pexports.tar.xz" 
        7z x -y pexports.tar.xz 
        7z x -y pexports.tar
        
    - name: Build
      run: | 
        $path = $env:Path
        $env:Path = "C:\mingw32\bin;"
        $env:Path += $path
        mingw32-make
        
